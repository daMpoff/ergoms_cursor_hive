[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-hive"
version = "0.1.0"
description = "Local shared-board collaboration for two Cursor agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil>=6,<8"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
dev = ["ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
cursor-hive = "cursor_hive_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cursor_hive_runtime = ["worker-policy.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
